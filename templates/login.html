<!DOCTYPE html>
    <html lang="es" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#00E000">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="RSV">
        <link rel="apple-touch-icon" href="/icon-192.png">
        <link rel="icon" type="image/png" href="/icon-192.png">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <script>
            (function() {
                const t = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            })();
        </script>
        <style>
            :root, html[data-theme="dark"] {
                --bg-main: #0a0a0a;
                --bg-card: rgba(26, 26, 26, 0.9);
                --border-color: rgba(85, 85, 85, 0.35);
                --text-main: #f5f5f5;
                --text-muted: #a0a0a0;
                --accent: #00e000;
                --accent-2: #00a800;
                --accent-gradient: linear-gradient(135deg, #00e000 0%, #00a800 100%);
                --accent-hover: #00c800;
                --input-bg: rgba(20, 20, 20, 0.65);
                color-scheme: dark;
            }
            html[data-theme="light"] {
                --bg-main: #f8f8f8;
                --bg-card: rgba(255, 255, 255, 0.92);
                --border-color: rgba(200, 200, 200, 0.7);
                --text-main: #1a1a1a;
                --text-muted: #666666;
                --accent: #00b800;
                --accent-2: #008a00;
                --accent-gradient: linear-gradient(135deg, #00c800 0%, #008a00 100%);
                --accent-hover: #009a00;
                --input-bg: rgba(248, 248, 248, 0.9);
                color-scheme: light;
            }
            * {
                box-sizing: border-box;
            }
            body {
                background: radial-gradient(ellipse at top, #141414 0%, #080808 55%, #000 100%);
                color: var(--text-main);
                font-family: 'Inter', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 15px;
                position: relative;
                overflow: hidden;
            }
            html[data-theme="light"] body {
                background: radial-gradient(ellipse at top, #ffffff 0%, #f0f0f0 60%, #e5e5e5 100%);
            }
            body::before {
                content: '';
                position: fixed;
                top: -20%;
                left: -10%;
                width: 60%;
                height: 60%;
                background: radial-gradient(circle, rgba(0, 224, 0, 0.08) 0%, transparent 60%);
                pointer-events: none;
                animation: orbA 22s ease-in-out infinite;
            }
            body::after {
                content: '';
                position: fixed;
                bottom: -20%;
                right: -10%;
                width: 60%;
                height: 60%;
                background: radial-gradient(circle, rgba(0, 168, 0, 0.06) 0%, transparent 60%);
                pointer-events: none;
                animation: orbB 28s ease-in-out infinite;
            }
            @keyframes orbA {
                0%, 100% { transform: translate(0, 0) scale(1); }
                50%      { transform: translate(30px, -30px) scale(1.15); }
            }
            @keyframes orbB {
                0%, 100% { transform: translate(0, 0) scale(1); }
                50%      { transform: translate(-30px, 30px) scale(1.15); }
            }
            .login-card {
                background: var(--bg-card);
                backdrop-filter: blur(24px) saturate(180%);
                -webkit-backdrop-filter: blur(24px) saturate(180%);
                padding: 36px 32px;
                border-radius: 20px;
                border: 1px solid var(--border-color);
                width: 100%;
                max-width: 400px;
                box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 224, 0, 0.08);
                position: relative;
                z-index: 1;
                animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            }
            @keyframes card-in {
                from { opacity: 0; transform: translateY(24px) scale(0.96); }
                to   { opacity: 1; transform: translateY(0) scale(1); }
            }
            h2 {
                margin-top: 0;
                margin-bottom: 28px;
                font-weight: 800;
                font-size: 26px;
                text-align: center;
                letter-spacing: -0.02em;
                background: var(--accent-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            label {
                display: block;
                font-size: 11.5px;
                font-weight: 600;
                letter-spacing: 0.03em;
                color: var(--text-muted);
                margin-bottom: 7px;
            }
            input {
                width: 100%;
                padding: 13px 16px;
                margin-bottom: 18px;
                border-radius: 10px;
                border: 1px solid var(--border-color);
                background: var(--input-bg);
                color: var(--text-main);
                font-size: 14px;
                font-family: inherit;
                transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            }
            input:hover {
                border-color: rgba(0, 224, 0, 0.3);
            }
            input:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(0, 224, 0, 0.15), 0 4px 12px rgba(0, 224, 0, 0.1);
            }
            button.btn-submit {
                width: 100%;
                padding: 13px;
                border: none;
                border-radius: 10px;
                background: var(--accent-gradient);
                color: #001200;
                font-weight: 700;
                font-size: 15px;
                cursor: pointer;
                letter-spacing: 0.01em;
                box-shadow: 0 4px 20px rgba(0, 224, 0, 0.3);
                transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease;
            }
            button.btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 28px rgba(0, 224, 0, 0.4);
                filter: brightness(1.05);
            }
            button.btn-submit:active {
                transform: translateY(0) scale(0.98);
            }
            .btn-theme {
                width: 100%;
                padding: 9px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--border-color);
                color: var(--text-main);
                border-radius: 10px;
                font-size: 12.5px;
                font-weight: 500;
                cursor: pointer;
                margin-bottom: 20px;
                transition: background 0.2s ease;
                font-family: inherit;
            }
            .btn-theme:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(0, 224, 0, 0.3);
            }
            html[data-theme="light"] .btn-theme {
                background: rgba(0, 0, 0, 0.03);
            }
            html[data-theme="light"] .btn-theme:hover {
                background: rgba(0, 0, 0, 0.06);
            }
            .alert {
                background: rgba(255, 51, 85, 0.15);
                border: 1px solid rgba(255, 51, 85, 0.3);
                color: #ff8a9e;
                font-size: 13px;
                padding: 12px 14px;
                border-radius: 10px;
                margin-bottom: 18px;
                animation: shake 0.4s ease;
            }
            .alert.success {
                background: rgba(0, 224, 0, 0.12);
                border-color: rgba(0, 224, 0, 0.3);
                color: #66ee66;
                animation: none;
            }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25%      { transform: translateX(-6px); }
                75%      { transform: translateX(6px); }
            }
        </style>
        <script>
            function togglePwd() {
                const i = document.getElementById("login-password");
                i.type = i.type === "password" ? "text" : "password";
            }

            function toggleLoginTheme() {
                const c = document.documentElement.getAttribute('data-theme') || 'dark';
                const n = c === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', n);
                localStorage.setItem('theme', n);
                document.getElementById('login-theme-btn').innerText = n === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
                });
            }
        </script>
    </head>
    <body>
        <div class="login-card">
            <button type="button" id="login-theme-btn" onclick="toggleLoginTheme()" class="btn-theme">☀️ Modo Claro</button>
            <div style="text-align: center; margin-bottom: 18px;">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="max-width: 80px; display: block; margin: 0 auto; filter: drop-shadow(0 8px 24px rgba(0,224,0,0.3));" onerror="this.style.display='none'">
            </div>
            <h2>🔐 INGRESO </h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for cat, msg in messages %}
                        <div class="alert {% if cat == 'success' %}success{% endif %}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST">
                <label>Usuario</label>
                <input type="text" name="username" required autocomplete="off">
                <label>Contraseña</label>
                <div style="position: relative; display: flex; align-items: center; margin-bottom: 22px;">
                    <input type="password" id="login-password" name="password" required style="margin-bottom: 0; padding-right: 42px;">
                    <button type="button" onclick="togglePwd()" style="position: absolute; right: 10px; width: auto; background: transparent; border: none; cursor: pointer; font-size: 16px; color: var(--accent); padding: 4px;">👁️</button>
                </div>
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
        </div>
    </body>
    </html>
